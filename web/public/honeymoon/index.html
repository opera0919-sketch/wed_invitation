<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>신혼여행 앱 주소가 바뀌었습니다</title>
<script>
/* 신혼여행 앱은 청첩장 앱(PWA 범위 /wed_invitation/)과 엉키지 않도록 별도 저장소(/honeymoon/)로 옮겼다.
   청첩장 앱 창(독립 실행)에서 열리면 청첩장 명단으로 되돌리고, 그 밖에는 새 주소로 보낸다. */
(function () { try {
  var sa = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  location.replace(sa ? "../" : "https://opera0919-sketch.github.io/honeymoon/");
} catch (e) { location.replace("https://opera0919-sketch.github.io/honeymoon/"); } })();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
<p>신혼여행 앱 주소가 바뀌었습니다. <a href="https://opera0919-sketch.github.io/honeymoon/">새 주소로 이동</a></p>
</body>
</html>
